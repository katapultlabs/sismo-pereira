<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Sismo Pereira">
  <!--
    The epicentre mark, promoted to a sigil.

    It is the masthead's small red square (see `site-header.tsx`) with the
    wavefront it implies drawn in: one solid ripple, one dashed ring echoing
    the seismograph chart-paper ruling behind the hero (`--rule-tick`).

    The plate is ink in both themes rather than matching the page substrate.
    A bone plate is invisible against a light browser tab strip, and a mark
    that disappears at 16px is not a mark. What does follow the theme is
    *which* ink: warm by day, the cold instrument face by night, the same
    distinction `globals.css` draws between "paper" and "noche".

    Red stays small on purpose. A fully red tile would read as `down` — a
    status, on a site where saturated colour means exactly that. Here it is
    a shape, so it cannot be misread.
  -->
  <style>
    :root {
      --plate: #1a1209; /* warm ink */
      --bone: #f6f2ea;  /* warm bone stock */
      --epi: #ef3b32;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --plate: #0d1117; /* cold instrument face */
        --bone: #f1f0ed;
        --epi: #f85149;
      }
    }
  </style>

  <rect width="32" height="32" rx="3" fill="var(--plate)" />

  <!-- Outer wavefront. `pathLength` normalises the circumference to 96 so the
       4/4 dash divides into exactly 12 ticks at any radius. -->
  <circle cx="16" cy="16" r="12.2" fill="none" stroke="var(--bone)"
          stroke-width="2.2" opacity="0.42"
          pathLength="96" stroke-dasharray="4 4" />

  <circle cx="16" cy="16" r="7.4" fill="none" stroke="var(--bone)"
          stroke-width="2.6" opacity="0.88" />

  <rect x="13" y="13" width="6" height="6" fill="var(--epi)" />
</svg>
